[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "urim-api"
version = "0.1.0"
description = "URIM public read-only system API for platform availability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.1",
  "psycopg[binary]>=3.2.3",
  "redis>=8.0.1,<9",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[project.scripts]
urim-sports-sync = "app.cli.sports_sync:main"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["app*"]
